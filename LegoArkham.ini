[Display]
; 1 = borderless windowed mode, 0 = off
Borderless=1

[Players]
; 1 = player 2 joins and leaves only with the "Player 2 toggle" button (F2 by default), 0 = off
F2Toggle=1

[Controls]
; 1 = mouse aiming for the batarang, 0 = off
Mouse=1
; 1 = the keyboard-and-mouse profile, 0 = off
ArkhamKeys=1
; reticle speed under the mouse as a percentage, 10 to 1000
AimSensitivity=100
; 1 = quick grapple: F fires the line at the nearest
; grapple point in sight, 0 = off
Grapple=1

[Gameplay]
; 1 = a "Save Game" entry in the pause menu, 0 = off
PauseMenuSave=1
; 1 = the listed characters glide in their default suits, 0 = off
Glide=1
; who gets the glide; anyone else, including the game's own gliders, is left alone
GlideCharacters=Batman,Robin,Batgirl
; 1 = Glide suit enables flight, 0 = off
GlideSuitFlight=1

[GlideClips]
; glide clip per character, next to this ini; unlisted characters keep the game's
Batman=LegoArkham_glide_batman.an3
Batgirl=LegoArkham_glide_batgirl.an3
Robin=LegoArkham_glide_robin.an3

[Camera]
; 1 = third-person camera, 0 = off; the "Camera toggle" button (F1 by default) switches player 1 between camera modes
Orbit=1
; 1 = third person camera collision, 0 = off
Collision=1
; distance from the character, 0.5 to 10 
Distance=2.0
; 1 = the mouse also turns the camera, 0 = off
MouseLook=1
; mouse speed as a percentage, 10 to 1000
MouseSensitivity=100

[Vehicle]
; how much looking off the nose steers a vehicle, as a percentage
; of full stick; 0 = off
LookSteer=35
